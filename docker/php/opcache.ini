# ==============================================================================
# KONFIGURASI PHP OPCACHE (ZEND BYTECODE ACCELERATOR)
# ==============================================================================
# INI APA: Modul akselerasi performa tingkat rendah (low-level) pada mesin PHP.
# KENAPA: PHP adalah bahasa interpreted. Tanpa OPcache, PHP harus membaca berkas teks .php,
#         mengurai sintaks (parsing), dan mengompilasinya menjadi bytecode setiap kali ada request.
# UNTUK APA & BAGAIMANA:
#   - Menyimpan bytecode yang sudah terkompilasi langsung di dalam shared memory (RAM).
#   - Menghilangkan waktu kompilasi berulang, membuat Laravel merespons 3x - 5x lebih cepat
#     dengan beban CPU server yang jauh lebih rendah.
# ==============================================================================

[opcache]
# INI APA: Saklar utama pengaktifan OPcache.
# BAGAIMANA: Nilai 1 berarti aktif melayani request produksi.
opcache.enable=1

# INI APA: Alokasi kapasitas memori RAM (dalam megabytes) untuk menyimpan bytecode PHP.
# BAGAIMANA: 128 MB sudah sangat cukup untuk menampung seluruh core Laravel dan dependensi vendor.
opcache.memory_consumption=128

# INI APA: Alokasi RAM (dalam MB) untuk string internal yang berulang (nama kelas, fungsi, method).
opcache.interned_strings_buffer=8

# INI APA: Jumlah maksimum skrip file PHP yang dapat dicache secara bersamaan di RAM.
# KENAPA: Laravel + Vendor memiliki ribuan file. Angka 10.000 menjamin semua file terakomodasi.
opcache.max_accelerated_files=10000

# INI APA: Validasi timestamp pembaruan file di harddisk/SSD.
# KENAPA: Di lingkungan produksi kontainer Docker, kode sumber bersifat statis (immutable).
#         Dengan memberi nilai 0, PHP TIDAK PERNAH memeriksa harddisk apakah file berubah,
#         sehingga menghilangkan I/O disk overhead secara total.
opcache.validate_timestamps=0

# INI APA: Penyimpanan komentar docblock / PHP attributes di dalam bytecode.
# KENAPA: Wajib bernilai 1 karena framework modern seperti Laravel 12 mengandalkan
#         PHP 8 Attributes dan anotasi refleksi untuk routing dan dependency injection.
opcache.save_comments=1

# INI APA: Urutan pembersihan memori kilat saat request selesai.
opcache.fast_shutdown=1
